# Keeps the free Hugging Face Space awake: free Spaces sleep after ~48 h without visits, and the first visit after
# that waits a minute or two for it to boot. This opens the health page every 12 hours (and on demand from the
# Actions tab). A failed run means the Space is down or still sleeping; GitHub e-mails the repo owner.
#
# Setup once: repo Settings → Secrets and variables → Actions → Variables → New repository variable
#   SPACE_URL = https://<hf-user>-machine-sound-monitor.hf.space
name: Keep Space awake

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 h (off the hour: GitHub delays jobs queued exactly on the hour)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping health endpoint
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "::notice::SPACE_URL repository variable is not set; nothing to ping"
            exit 0
          fi
          # A sleeping Space answers slowly or with 503 while it boots: retry for up to ~5 minutes.
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 30 "$SPACE_URL/api/v1/health") && echo "$body" | grep -q '"service":"ok"' && {
              echo "awake: $body"; exit 0; }
            echo "attempt $i: not ready yet"; sleep 30
          done
          echo "::error::$SPACE_URL did not answer /api/v1/health"; exit 1

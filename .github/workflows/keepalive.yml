# Keeps the deployed app awake. Render's free web service sleeps after 15 min without requests, and the first request
# after that waits ~50 s for it to boot; Vercel serves static files and never sleeps, but is checked so a broken
# deploy shows up here too. Runs every 10 min (GitHub may delay scheduled runs by several minutes) and on demand from
# the Actions tab. A failed run means a service is down; GitHub e-mails the repo owner.
#
# Override the defaults with repository variables (Settings → Secrets and variables → Actions → Variables):
#   API_URL = https://<render-service>.onrender.com     APP_URL = https://<vercel-domain>
name: Keep app awake

on:
  schedule:
    - cron: "3-59/10 * * * *" # every 10 min, off the hour: GitHub delays jobs queued exactly on the hour
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API health (Render)
        env:
          API_URL: ${{ vars.API_URL || 'https://machine-sound-monitor-api.onrender.com' }}
        run: |
          # A sleeping service answers slowly or with 502/503 while it boots: retry for up to ~5 minutes.
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 90 "$API_URL/api/v1/health") && echo "$body" | grep -q '"service":"ok"' && {
              echo "awake: $body"; exit 0; }
            echo "attempt $i: not ready yet"; sleep 20
          done
          echo "::error::$API_URL did not answer /api/v1/health"; exit 1
      - name: Check frontend (Vercel)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://machine-sound-monitor.vercel.app' }}
        run: curl -fsS --max-time 30 -o /dev/null -w "frontend %{http_code}\n" "$APP_URL/"
